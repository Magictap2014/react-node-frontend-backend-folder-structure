# Generous timeouts for slower backend work (PDF/Playwright rendering, AI
# calls) with buffering off so requests/responses stream straight through
# instead of nginx fully buffering them first. Shared by the main API-facing
# locations — not used by /socket.io/ (which needs its own much longer
# timeouts for a persistent connection) or the small static-passthrough
# locations (/docs, /csrf-token, /health, /openapi.json, /metrics).
proxy_connect_timeout 120s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;
proxy_buffering off;
proxy_request_buffering off;
