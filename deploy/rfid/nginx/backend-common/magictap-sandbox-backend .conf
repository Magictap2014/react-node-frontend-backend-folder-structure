# /etc/nginx/sites-enabled/magictap-sandbox-backend 
server {
    server_name sandbox-backend.magictap.global;

    include /etc/nginx/snippets/sandbox-backend-logs.conf;

    include  /etc/nginx/backend-configs/born-straggler.conf;
    include /etc/nginx/backend-configs/cgc-registration-poster.conf;
    include /etc/nginx/backend-configs/cgc-feedback-wall.conf;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sandbox-backend.magictap.global/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sandbox-backend.magictap.global/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = sandbox-backend.magictap.global) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name sandbox-backend.magictap.global;
    include /etc/nginx/snippets/sandbox-backend-logs.conf;
    return 404; # managed by Certbot


}
