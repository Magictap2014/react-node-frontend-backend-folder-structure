# =========================
# CGC Feedback Wall — /feedback-wall/* (Node.js Express API)
# /etc/nginx/backend-configs/cgc-feedback-wall.conf
# =========================

location /feedback-wall/socket.io/ {
    include /etc/nginx/snippets/cgc-feedback-wall-logs.conf;
    proxy_pass http://cgc-feedback-wall-backend/feedback-wall/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
    proxy_buffering off;
}

location /feedback-wall/api/admin/ {
    include /etc/nginx/snippets/cgc-feedback-wall-logs.conf;
    limit_req zone=general_zone burst=20 nodelay;
    proxy_pass http://cgc-feedback-wall-backend/feedback-wall/api/admin/;
    include /etc/nginx/snippets/proxy-headers.conf;
    include /etc/nginx/snippets/proxy-timeouts.conf;
}

location /feedback-wall/api/drawings {
    include /etc/nginx/snippets/cgc-feedback-wall-logs.conf;
    limit_req zone=general_zone burst=20 nodelay;
    proxy_pass http://cgc-feedback-wall-backend/feedback-wall/api/drawings;
    include /etc/nginx/snippets/proxy-headers.conf;
    include /etc/nginx/snippets/proxy-timeouts.conf;
}

location /feedback-wall/api/ {
    include /etc/nginx/snippets/cgc-feedback-wall-logs.conf;
    limit_req zone=general_zone burst=20 nodelay;
    proxy_pass http://cgc-feedback-wall-backend/feedback-wall/api/;
    include /etc/nginx/snippets/proxy-headers.conf;
    include /etc/nginx/snippets/proxy-timeouts.conf;
}

location /feedback-wall/health {
    include /etc/nginx/snippets/cgc-feedback-wall-logs.conf;
    proxy_pass http://cgc-feedback-wall-backend/feedback-wall/health;
    include /etc/nginx/snippets/proxy-headers.conf;
}
