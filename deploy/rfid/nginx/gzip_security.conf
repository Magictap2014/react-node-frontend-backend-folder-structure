client_max_body_size 50M;
client_body_buffer_size 2M;
client_body_timeout 120s;

gzip on;
gzip_min_length 1000;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/rss+xml
    text/javascript
    image/svg+xml
    image/png
    image/jpeg
    image/gift
    image/webp
    image/avif
    image/bmp
    image/tiff
    image/x-icon;
