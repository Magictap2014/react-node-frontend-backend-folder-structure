    }

    # ==========================================
    # CGC Feedback Wall
    # ==========================================

    # Backend Socket.IO
    location /feedback-wall/socket.io/ {
        proxy_pass https://sandbox-backend.magictap.global/feedback-wall/socket.io/;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host sandbox-backend.magictap.global;

