    }

    # Frontend static files
    location /feedback-wall/ {
        alias /var/www/cgc-feedback-wall/;
        index index.html;

        try_files $uri $uri/ /feedback-wall/index.html;

        access_log off;
        error_log /var/log/nginx/cgc-feedback-wall_error.log warn;
    }

    # ==========================================
    # Frontend D
    # ==========================================

    # location /frontend-d/ {
    #     alias /var/www/frontend-d/;
    #     index index.html;
    #     try_files $uri $uri/ /frontend-d/index.html;
    #     access_log off;
    #     error_log /var/log/nginx/frontend-d_error.log warn;
    # }


    # ==========================================
    # Security / Compression
    # ==========================================

    include /etc/nginx/conf.d/gzip_security.conf;

    access_log off;

    # Catch-all server-level errors
    error_log /var/log/nginx/cgc_frontend_error.log warn;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cgc.magictap.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cgc.magictap.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = cgc.magictap.co.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name cgc.magictap.co.in;
    return 404; # managed by Certbot


}
