# =========================
# Frontend Nginx Configuration
# =========================

server {
    server_name cgc.magictap.co.in;

    # Proxy root to external domain (URL stays as cgc.magictap.co.in)
    location / {
        proxy_pass https://reg.momentryhub.com;

        proxy_set_header Host reg.momentryhub.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_server_name on;
        proxy_ssl_name reg.momentryhub.com;
    }

    # ==========================================
    # CGC Registration Poster
    # ==========================================

    # Backend Socket.IO
    location /i-am-attending/socket.io/ {
        proxy_pass https://sandbox-backend.magictap.global/i-am-attending/socket.io/;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host sandbox-backend.magictap.global;

        proxy_ssl_server_name on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        error_log /var/log/nginx/cgc-registration-poster_socket_error.log warn;
    }

    # Backend API
    location /i-am-attending/v1/ {
        proxy_pass https://sandbox-backend.magictap.global/i-am-attending/v1/;

        proxy_set_header Host sandbox-backend.magictap.global;
        proxy_ssl_server_name on;

        error_log /var/log/nginx/cgc-registration-poster_api_error.log warn;
    }

    # Frontend static files
    location /i-am-attending/ {
        alias /var/www/cgc-registration-poster/;
        index index.html;

        try_files $uri $uri/ /i-am-attending/index.html;

        access_log off;
        error_log /var/log/nginx/cgc-registration-poster_error.log warn;
    }


    # ==========================================
    # CGC Digi Run
    # ==========================================

    # Backend Socket.IO
    location /digi-run/socket.io/ {
        proxy_pass https://sandbox-backend.magictap.global/digi-run/socket.io/;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host sandbox-backend.magictap.global;

        proxy_ssl_server_name on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        error_log /var/log/nginx/cgc-digi-run_socket_error.log warn;
    }

    # Backend API
    location /digi-run/v1/ {
        proxy_pass https://sandbox-backend.magictap.global/digi-run/v1/;

        proxy_set_header Host sandbox-backend.magictap.global;
        proxy_ssl_server_name on;

        error_log /var/log/nginx/cgc-digi-run_api_error.log warn;
    }

    # Frontend static files
    location /digi-run/ {
        alias /var/www/cgc-digi-run/;
        index index.html;

        try_files $uri $uri/ /digi-run/index.html;

        access_log off;
        error_log /var/log/nginx/cgc-digi-run_error.log warn;
    }


    # ==========================================
    # Paddle to Lightup
    # ==========================================

    # Backend Socket.IO
    location /paddle-to-lightup/socket.io/ {
        proxy_pass https://sandbox-backend.magictap.global/paddle-to-lightup/socket.io/;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host sandbox-backend.magictap.global;

        proxy_ssl_server_name on;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        error_log /var/log/nginx/paddle-to-lightup_socket_error.log warn;
    }

    # Backend API
    location /paddle-to-lightup/v1/ {
        proxy_pass https://sandbox-backend.magictap.global/paddle-to-lightup/v1/;

        proxy_set_header Host sandbox-backend.magictap.global;
