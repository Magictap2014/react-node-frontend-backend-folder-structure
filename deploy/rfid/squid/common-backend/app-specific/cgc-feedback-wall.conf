# =========================
# CGC FEEDBACK WALL — egress
# =========================
# Install: /etc/squid/projects/cgc-feedback-wall.conf
# Backend uses HTTP(S)_PROXY=http://host.docker.internal:3130

http_port 3130 name=cgc-feedback-wall

acl cgc_feedback_wall_port myportname cgc-feedback-wall
acl cgc_feedback_wall_domains dstdomain "/etc/squid/domains/cgc-feedback-wall.txt"

http_access allow cgc_feedback_wall_port cgc_feedback_wall_domains

access_log daemon:/var/log/squid/cgc-feedback-wall_error.log squid cgc_feedback_wall_port errors
