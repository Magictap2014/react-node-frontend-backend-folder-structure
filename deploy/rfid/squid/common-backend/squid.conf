# =========================
# SQUID — COMMON (shared rules + default port 3128, not tied to any project)
# =========================
# Install: /etc/squid/squid.conf — each project gets its own port (3129, 3130…) in /etc/squid/projects/<project>.conf

visible_hostname sandbox-backend.magictap.global

http_port 3128 name=default

# Who may use the proxy: the host itself + docker networks (backend containers)
acl localnet src 127.0.0.1/32 ::1
acl localnet src 172.16.0.0/12

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

# Shared by every project's access_log — only failed/blocked requests are logged
acl errors http_status 400-599

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
# Block pivoting to the host / internal services through the proxy
http_access deny to_localhost
http_access deny to_linklocal
http_access deny !localnet

# Default port — shared allowlist only
acl default_port myportname default
acl default_domains dstdomain "/etc/squid/domains/default.txt"
http_access allow default_port default_domains
access_log daemon:/var/log/squid/default_error.log squid default_port errors

# Projects: http_port + allowlist + http_access allow + access_log
include /etc/squid/projects/*.conf

http_access deny all

# Pure egress control, no caching (API/OAuth responses must never be cached)
cache deny all
cache_mem 0 MB

# Don't leak internal container IPs or the squid version to upstream APIs (Via stays on — HTTP requires it)
forwarded_for delete
httpd_suppress_version_string on

dns_nameservers 1.1.1.1 8.8.8.8

cache_log /var/log/squid/cache.log
logfile_rotate 10

coredump_dir /var/spool/squid
shutdown_lifetime 5 seconds