services:

  feedback-wall:
    image: ${CGC_FEEDBACK_WALL_BACKEND_IMAGE:-magictap-backend:latest}
    container_name: ${CGC_FEEDBACK_WALL_CONTAINER_NAME:-feedback-wall-backend}
    restart: always
    ports:
      - "127.0.0.1:${CGC_FEEDBACK_WALL_HOST_PORT:-8007}:${CGC_FEEDBACK_WALL_CONTAINER_PORT:-5007}"
    env_file:
      - .env
      - .env.cgc-registration-poster
    environment:
      - MONGO_DATABASE_URL=${CGC_FEEDBACK_WALL_MONGO_DATABASE_URL:-mongodb://magictap-mongodb:27017/magictap-db}
      - REDIS_URL=${CGC_FEEDBACK_WALL_REDIS_URL:-redis://magictap-redis:6379/0}
    extra_hosts:
      - "host.docker.internal:host-gateway"          
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CGC_FEEDBACK_WALL_CONTAINER_PORT:-5007}/feedback-wall/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - magictap-network

volumes:
  mongo-data:

networks:
  magictap-network:
    driver: bridge
